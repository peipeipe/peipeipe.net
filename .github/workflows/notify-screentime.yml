name: Notify daily screen time

on:
  schedule:
    # 08:00 Asia/Tokyo = 23:00 UTC on the previous day.
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: astro/.node-version
      - name: Send yesterday's screen time to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notify_screentime.mjs
