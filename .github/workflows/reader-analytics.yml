name: Deploy reader analytics

on:
  workflow_dispatch:
    inputs:
      database_id:
        description: Cloudflare D1 database ID for peipeipe-reader-analytics
        required: true
        type: string
      pv_mode:
        description: 通常PV通知（daily=日次、each=各PVを5分ごとに順次送信）
        type: choice
        options: [daily, each]
        default: daily

permissions:
  contents: read

concurrency:
  group: reader-analytics-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/reader-analytics
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: astro/.node-version
          cache: npm
          cache-dependency-path: workers/reader-analytics/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Configure database and prepare Worker secrets
        env:
          DATABASE_ID: ${{ inputs.database_id }}
          PV_MODE: ${{ inputs.pv_mode }}
          IP_HASH_SECRET: ${{ secrets.READER_ANALYTICS_IP_HASH_SECRET }}
          ADMIN_TOKEN: ${{ secrets.READER_ANALYTICS_ADMIN_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, uuid
          database_id = str(uuid.UUID(os.environ['DATABASE_ID']))
          secrets = {key: os.environ.get(key, '') for key in ['IP_HASH_SECRET', 'ADMIN_TOKEN', 'DISCORD_WEBHOOK_URL']}
          if any(len(secrets[key]) < 32 for key in ['IP_HASH_SECRET', 'ADMIN_TOKEN']):
              raise SystemExit('Set READER_ANALYTICS_IP_HASH_SECRET and READER_ANALYTICS_ADMIN_TOKEN (32+ characters).')
          if not secrets['DISCORD_WEBHOOK_URL'].startswith('https://discord.com/api/webhooks/'):
              raise SystemExit('Set the existing DISCORD_WEBHOOK_URL repository secret.')
          config_path = pathlib.Path('wrangler.jsonc')
          config = json.loads(config_path.read_text())
          config['d1_databases'][0]['database_id'] = database_id
          config['vars']['PV_MODE'] = os.environ['PV_MODE']
          config_path.write_text(json.dumps(config, indent=2) + '\n')
          secret_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reader-analytics-secrets.json'
          secret_path.touch(mode=0o600)
          secret_path.write_text(json.dumps(secrets))
          PY
      - run: npm run check
      - name: Apply schema and deploy
        run: |
          npx wrangler d1 migrations apply peipeipe-reader-analytics --remote
          npm run deploy
          npx wrangler secret bulk "$RUNNER_TEMP/reader-analytics-secrets.json"
      - name: Remove temporary secret file
        if: always()
        run: rm -f "$RUNNER_TEMP/reader-analytics-secrets.json"
