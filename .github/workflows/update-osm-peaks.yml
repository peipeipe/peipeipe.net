name: Update OSM Peaks

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-osm-peaks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch OSM peaks
        run: python scripts/fetch_osm_peaks.py

      - name: Summarize peak changes
        id: peak-diff
        run: python scripts/diff_osm_peaks.py --payload "$RUNNER_TEMP/osm_peaks_diff.json"

      - name: Generate mountains data
        run: |
          python scripts/generate_mountains.py
          python scripts/generate_visited_mountains.py

      - name: Commit and push changes
        id: commit-changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add scripts/osm_peaks.json astro/data/mountains.json astro/data/visited_mountains.json
          if git diff --cached --exit-code; then
            echo "No peak changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update OSM peaks"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Cloudflare Pages deploy
        if: steps.commit-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cloudflare-pages.yml --ref "${GITHUB_REF_NAME:-master}"

      - name: Notify Discord
        if: steps.peak-diff.outputs.changed == 'true' && steps.commit-changes.outputs.changed == 'true' && env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d @"$RUNNER_TEMP/osm_peaks_diff.json" "$DISCORD_WEBHOOK_URL"
