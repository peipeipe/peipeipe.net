name: Update OSM Peaks

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-osm-peaks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch OSM peaks
        run: python scripts/fetch_osm_peaks.py

      - name: Summarize peak changes
        id: peak-diff
        run: python scripts/diff_osm_peaks.py --payload "$RUNNER_TEMP/osm_peaks_diff.json"

      - name: Generate mountains data
        run: |
          python scripts/generate_mountains.py
          python scripts/generate_visited_mountains.py

      - name: Commit and push changes
        id: commit-changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add scripts/osm_peaks.json astro/data/mountains.json astro/data/visited_mountains.json
          if git diff --cached --exit-code; then
            echo "No peak changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update OSM peaks"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
              if git push; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Push failed; retrying after remote update (attempt $attempt/3)"
              sleep $((attempt * 5))
            done
            echo "Failed to push OSM peak updates after 3 attempts"
            exit 1
          fi

      - name: Trigger Cloudflare Pages deploy
        if: steps.commit-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cloudflare-pages.yml --ref "${GITHUB_REF_NAME:-master}"

      - name: Notify Discord
        if: steps.peak-diff.outputs.changed == 'true' && steps.commit-changes.outputs.changed == 'true' && env.DISCORD_WEBHOOK_URL != ''
        run: |
          # 送信内容とレスポンスをログに残す（ペイロードに秘密情報は含まれない）
          cat "$RUNNER_TEMP/osm_peaks_diff.json"
          # wait=true を付けると Discord が投稿されたメッセージを返すので、
          # 実際にどのチャンネルに入ったかまで確認できる
          case "$DISCORD_WEBHOOK_URL" in
            *\?*) url="$DISCORD_WEBHOOK_URL&wait=true" ;;
            *) url="$DISCORD_WEBHOOK_URL?wait=true" ;;
          esac
          code=$(curl -sS -X POST -H "Content-Type: application/json" \
            -d @"$RUNNER_TEMP/osm_peaks_diff.json" \
            -o "$RUNNER_TEMP/discord_response.txt" -w '%{http_code}' \
            "$url") || exit 1
          echo "Discord response: HTTP $code"
          cat "$RUNNER_TEMP/discord_response.txt"
          [ "$code" -lt 400 ] || exit 1
